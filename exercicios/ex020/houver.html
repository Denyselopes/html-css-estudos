<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        div > p {
            display: none;
            color: crimson;
        }

        div:hover > p {
            display: block;
            color: cadetblue;
            background-color: #f0f0f0;
            width: 200px;
            margin: 10px auto;

        }

        div:hover {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo para ver a mudança de cor.</p>
    <div>
        Passe o mouse AQUI
        <p>TEXTO ESCONDIDO...</p>
    </div>
</body>
</html>
