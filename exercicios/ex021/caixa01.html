<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: #cdccca;
            height: 300px;
            width: 300px;

            border: 10px solid #6d8f85;

            padding: 15px 25px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            margin: 10px auto 10px auto;
            
        }

        a {
            background-color: #cdccca;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: #0d4233;

            padding: 10px 20px;

            margin: 20px 15px 40px 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixas box-level</h1>
    <p>paragrafos tambem sao exemplos de caixas box-level, mas os <a href="#">links sao exemplos de caixas inline-level</a> vamos ver como tudo isso funciona.</p>
</body>
</html>
