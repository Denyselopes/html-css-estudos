<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplismente aumentar e diminuir o tamanho da janela do navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 950px)" srcset="imagens/foto-m.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-g.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível" width="100%">
    </picture>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto.jpg" type="image/jpeg">
        <source media="(max-width: 950px)" srcset="imagens/foto.JPG" type="image/jpeg">
        <source media="(max-width: 1050px)" srcset="imagens/foto.JPG" type="image/jpeg">
        <img src="imagens/foto.JPG" alt="Imagem flexível" width="100%">
    </picture>
    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5.
        <audio controls>
            <source src="midia/Curso-MV.mp3" autoplay type="audio/mp3">
        </audio>

        <h2>outros tipos de audios</h2>
        <audio preload="metadata" controls autoplay>
            <source src="midia/Curso-MV.ogg" type="audio/ogg">
            <source src="midia/Curso-MV.wav" type="audio/wav"> <!-- E muito pessado esse estilo de arquivo -->
            <source src="midia/Curso-MV.mp3" type="audio/mp3">
            <source src="midia/Curso-MV.aac" type="audio/aac">
            <source src="midia/Curso-MV.m4a" type="audio/m4a">
            <source src="midia/Curso-MV.mp3" type="audio/mp3">
        </audio>
    </p>
</body>
</html>
