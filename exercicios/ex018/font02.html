<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts Externas</title>
    <style>
        @font-face {
            font-family: 'Madeleine';
            src: url('fontes/Madeleine.ttf Bold.ttf') format('openType'), url('fontes/Madeleine Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /* Tipos de format()
            truetype - .ttf
            opentype - .otf
            embedded-opentype - .eot
            svg - .svg
            truetype-aat (apple advanced typography) - .ttf
            */
        }
        body {
            font-family:Arial, Helvetica, sans-serif
        }

        h1 {
            font-family: 'Madeleine', cursive;
            font-size: 90px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Ola Mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Non, suscipit ducimus aut architecto minima quaerat veniam neque omnis earum veritatis molestiae sit eum explicabo magnam illum voluptate!</p>
</body>
</html>
